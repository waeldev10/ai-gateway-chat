      summary: Edit a user message and regenerate its reply
      description: |
        Edits a user message and regenerates its immediate assistant reply. If
        the user message is the latest message, an assistant reply is created.
        Later messages are preserved. Editing an assistant message returns 403.
        If the next message is not an assistant message, the edit fails with
        422. Provider failure rolls back the user edit and assistant replacement.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
            examples:
              editMessage:
                summary: Edit a user message
                value:
                  content: "Edited question"
      responses:
