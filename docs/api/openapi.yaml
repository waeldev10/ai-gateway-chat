components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: |
        Send the plain-text token returned by register or login:
        `Authorization: Bearer {access_token}`.
  parameters:
    ConversationId:
      name: conversation
      in: path
      required: true
      description: Conversation identifier.
      schema:
        $ref: '#/components/schemas/Ulid'
    MessageId:
      name: message
      in: path
      required: true
      description: Message identifier within the parent conversation.
      schema:
        $ref: '#/components/schemas/Ulid'
    PersonaId:
      name: persona
      in: path
      required: true
      description: Persona identifier.
      schema:
        $ref: '#/components/schemas/Ulid'
    SearchQuery:
      name: search
      in: query
      required: false
      description: Filters the authenticated user's conversations by title.
      schema:
        type: string
        maxLength: 255
      example: "Japan"
    QQuery:
      name: q
      in: query
      required: false
      description: Alias for search. Used only when search is absent.
      schema:
        type: string
        maxLength: 255
      example: "study"
    PerPageQuery:
      name: per_page
      in: query
      required: false
      description: Number of conversations per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
      example: 15
    PageQuery:
      name: page
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 1
      example: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Number of messages per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Cursor from meta.next_cursor or meta.prev_cursor.
      schema:
        type: string
      example: "eyJpZCI6IjAxSlo5TTBSNlY4WDNLNFA1UTdTOVQyVzZBIn0"
  responses:
    Unauthenticated:
      description: Authentication is required or the bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthenticated:
              summary: Missing or invalid bearer token
              value:
                type: "about:blank"
                title: "Unauthenticated"
                status: 401
                detail: "Unauthenticated."
                code: "unauthenticated"
    Forbidden:
      description: The authenticated user may not perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forbidden:
              summary: Ownership or policy check failed
              value:
                type: "about:blank"
                title: "Forbidden"
                status: 403
                detail: "ليس لديك صلاحية لتنفيذ هذا الإجراء."
                code: "forbidden"
    NotFound:
      description: The requested route or model was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              summary: Conversation, message, or persona not found
              value:
                type: "about:blank"
                title: "Not Found"
                status: 404
                detail: "تعذر العثور على المورد المطلوب."
                code: "not_found"
    ValidationFailed:
      description: Request validation failed. Validation messages are Arabic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            validationFailed:
              summary: Validation errors
              value:
                type: "about:blank"
                title: "Validation Failed"
                status: 422
                detail: "بيانات الطلب غير صحيحة."
                code: "validation_failed"
                errors:
                  content:
                    - "المحتوى مطلوب."
    ConversationBusy:
      description: Another operation is currently running on the conversation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            conversationBusy:
              summary: Conversation operation lock is held
              value:
                type: "about:blank"
                title: "Conversation Busy"
                status: 409
                detail: "هناك عملية أخرى قيد التنفيذ على هذه المحادثة. يرجى إعادة المحاولة لاحقاً."
                code: "conversation_busy"
    ProviderFailed:
      description: The configured AI provider could not produce a response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            providerFailed:
              summary: AI provider failure
              value:
                type: "about:blank"
                title: "AI Provider Error"
                status: 502
                detail: "تعذر الحصول على رد من مزود الذكاء الاصطناعي. يرجى المحاولة لاحقًا."
                code: "provider_failed"
    TooManyRequests:
      description: A rate limit was exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Maximum attempts allowed in the current window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Attempts remaining in the current window.
          schema:
            type: integer
        X-RateLimit-Reset:
          description: UNIX timestamp when the current window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            tooManyRequests:
              summary: Rate limit exceeded
              value:
                type: "about:blank"
                title: "Too Many Requests"
                status: 429
                detail: "عدد الطلبات كبير جدًا. يرجى المحاولة لاحقًا."
                code: "rate_limited"
                retry_after: 60
    ServerError:
      description: An unexpected server error occurred. Internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            serverError:
              summary: Internal server error
              value:
                type: "about:blank"
                title: "Server Error"
                status: 500
                detail: "حدث خطأ غير متوقع. يرجى المحاولة لاحقًا."
                code: "server_error"
  schemas:
    Ulid:
      type: string
      description: ULID resource identifier.
      pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      example: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 255
          example: "Example User"
        email:
          type: string
          format: email
          maxLength: 255
          example: "user@example.com"
    AuthTokenResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          type: object
          required:
            - user
            - access_token
            - token_type
          properties:
            user:
              $ref: '#/components/schemas/User'
            access_token:
              type: string
              description: |
                Plain-text Sanctum personal access token. It is returned only
                when the token is issued and must be stored securely by the client.
              example: "1|examplePlainTextTokenThatIsOnlyReturnedOnce"
            token_type:
              type: string
              const: "Bearer"
        message:
          type: string
          example: "تم تسجيل الدخول بنجاح."
    UserResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserMessageResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          $ref: '#/components/schemas/User'
        message:
          type: string
          example: "تم تحديث الملف الشخصي بنجاح."
    ActionResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          type: 'null'
        message:
          type: string
          example: "تم حذف المحادثة بنجاح."
    Conversation:
      type: object
      required:
        - id
        - title
        - is_pinned
        - pinned_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        title:
          type:
            - string
            - 'null'
          maxLength: 255
          example: "Planning a trip"
        is_pinned:
          type: boolean
          example: false
        pinned_at:
          type:
            - string
            - 'null'
          format: date-time
          example: "2026-11-12T09:00:00+00:00"
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: "2026-11-10T08:30:00+00:00"
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: "2026-11-12T09:00:00+00:00"
    ConversationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Conversation'
        message:
          type: string
          example: "تم تحديث المحادثة بنجاح."
    PageLinks:
      type: object
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type:
            - string
            - 'null'
          format: uri
        last:
          type:
            - string
            - 'null'
          format: uri
        prev:
          type:
            - string
            - 'null'
          format: uri
        next:
          type:
            - string
            - 'null'
          format: uri
    PageMeta:
      type: object
      required:
        - path
        - current_page
        - from
        - last_page
        - per_page
        - to
        - total
      properties:
        path:
          type: string
          format: uri
        current_page:
          type: integer
          minimum: 1
        from:
          type:
            - integer
            - 'null'
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        to:
          type:
            - integer
            - 'null'
          minimum: 1
        total:
          type: integer
          minimum: 0
    ConversationListResponse:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        links:
          $ref: '#/components/schemas/PageLinks'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CursorLinks:
      type: object
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: 'null'
        last:
          type: 'null'
        prev:
          type:
            - string
            - 'null'
          format: uri
        next:
          type:
            - string
            - 'null'
          format: uri
    CursorMeta:
      type: object
      required:
        - path
        - per_page
        - next_cursor
        - prev_cursor
      properties:
        path:
          type: string
          format: uri
        per_page:
          type: integer
          minimum: 1
        next_cursor:
          type:
            - string
            - 'null'
        prev_cursor:
          type:
            - string
            - 'null'
    MessageRole:
      type: string
      enum:
        - user
        - assistant
        - system
    MessageStatus:
      type: string
      enum:
        - pending
        - complete
        - failed
        - cancelled
    Message:
      type: object
      required:
        - id
        - role
        - content
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
          example: "Hello there"
        status:
          $ref: '#/components/schemas/MessageStatus'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: "2026-11-13T10:14:00+00:00"
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: "2026-11-13T10:14:00+00:00"
    MessageResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          $ref: '#/components/schemas/Message'
        message:
          type: string
          example: "تم متابعة المحادثة بنجاح."
    MessageExchange:
      type: object
      required:
        - user_message
        - assistant_message
      properties:
        user_message:
          $ref: '#/components/schemas/Message'
        assistant_message:
          $ref: '#/components/schemas/Message'
    MessageExchangeResponse:
      type: object
      required:
        - data
        - message
      properties:
        data:
          $ref: '#/components/schemas/MessageExchange'
        message:
          type: string
          example: "تم إرسال الرسالة بنجاح."
    MessageListResponse:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        links:
          $ref: '#/components/schemas/CursorLinks'
        meta:
          $ref: '#/components/schemas/CursorMeta'
    Persona:
      type: object
      required:
        - id
        - name
        - system_prompt
        - is_active
        - is_system
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 100
          example: "Code Reviewer"
        system_prompt:
          type: string
          example: "Review code carefully and explain tradeoffs."
        is_active:
          type: boolean
          example: true
        is_system:
          type: boolean
          readOnly: true
          description: True for the system default persona; false for custom personas.
          example: false
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    PersonaResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Persona'
        message:
          type: string
          example: "تم تحديث الشخصية بنجاح."
    PersonaListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          const: "about:blank"
        title:
          type: string
          example: "Validation Failed"
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          example: "بيانات الطلب غير صحيحة."
        code:
          type: string
          description: Stable application error code.
          example: "validation_failed"
        retry_after:
          type: integer
          minimum: 1
          description: Seconds until the client may retry. Present on rate-limited responses when available.
          example: 60
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              description: Validation errors keyed by request field. Messages are Arabic.
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                content:
                  - "المحتوى مطلوب."
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
          example: "Example User"
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalized to lowercase before validation and persistence.
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          writeOnly: true
          example: "password"
        password_confirmation:
          type: string
          writeOnly: true
          example: "password"
        device_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional Sanctum token name. Defaults to api-token.
          example: "mobile-app"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalized to lowercase before authentication.
          example: "user@example.com"
        password:
          type: string
          writeOnly: true
          example: "password"
        device_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional Sanctum token name. Defaults to api-token.
          example: "web-client"
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: "Updated User"
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalized to lowercase and unique except for the current user's email.
          example: "updated@example.com"
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - password
        - password_confirmation
      properties:
        current_password:
          type: string
          writeOnly: true
          example: "password"
        password:
          type: string
          minLength: 8
          writeOnly: true
          example: "new-password"
        password_confirmation:
          type: string
          writeOnly: true
          example: "new-password"
    StoreConversationRequest:
      type: object
      properties:
        title:
          type:
            - string
            - 'null'
          maxLength: 255
          example: "Planning a trip"
    UpdateConversationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
          example: "New title"
    BulkDeleteConversationsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Ulid'
          example:
            - "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
            - "01JZ9M0R6V8X3K4P5Q7S9T2W6B"
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          example: "Hello there"
        persona_id:
          type:
            - string
            - 'null'
          pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$"
          description: Optional visible persona identifier.
          example: "01JZ9M0R6V8X3K4P5Q7S9T2W6D"
    ContinueConversationRequest:
      type: object
      properties:
        persona_id:
          type:
            - string
            - 'null'
          pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$"
          description: Optional visible persona identifier.
          example: "01JZ9M0R6V8X3K4P5Q7S9T2W6D"
    UpdateMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          example: "Edited question"
        persona_id:
          type:
            - string
            - 'null'
          pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$"
          description: Optional visible persona identifier.
          example: "01JZ9M0R6V8X3K4P5Q7S9T2W6D"
    RegenerateMessageRequest:
      type: object
      properties:
        persona_id:
          type:
            - string
            - 'null'
          pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$"
          description: Optional visible persona identifier.
          example: "01JZ9M0R6V8X3K4P5Q7S9T2W6D"
    StorePersonaRequest:
      type: object
      required:
        - name
        - system_prompt
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Code Reviewer"
        system_prompt:
          type: string
          minLength: 1
          maxLength: 8000
          example: "Review code carefully and explain tradeoffs."
        is_active:
          type: boolean
          default: true
          example: true
    UpdatePersonaRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Updated Persona"
        system_prompt:
          type: string
          minLength: 1
          maxLength: 8000
          example: "Updated instructions."
        is_active:
          type: boolean
          example: false
