openapi: 3.1.0
info:
  title: ai-gateway-chat API
  version: 1.0.0
  description: |
    Version 1 API for ai-gateway-chat. API clients authenticate with Laravel
    Sanctum personal access tokens sent as Bearer tokens.

    All success responses use a `data` envelope. Errors use an RFC 9457
    Problem Details structure with an application error `code`. Validation
    messages are Arabic.

    Public endpoints are registration and login. Every other endpoint requires
    a valid bearer token. Conversations and messages are restricted to their
    owner. The system default persona is visible to every authenticated user
    but cannot be modified.
  contact:
    name: ai-gateway-chat
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same origin as the application serving this API
tags:
  - name: Auth
    description: Registration, login, token revocation, profile updates, password changes, and the authenticated user profile.
  - name: Conversations
    description: Conversation listing, search, creation, retrieval, updates, deletion, bulk deletion, pinning, and unpinning.
  - name: Messages
    description: Message listing, sending, continuation, editing, and regeneration.
  - name: Personas
    description: AI persona listing, creation, retrieval, updates, deletion, activation, and deactivation.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register a user and issue an access token
      description: |
        Creates a user, hashes the password, and issues a Sanctum personal
        access token. The plain-text token is returned only in this response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              registration:
                summary: Register a user
                value:
                  name: "Example User"
                  email: "user@example.com"
                  password: "password"
                  password_confirmation: "password"
                  device_name: "mobile-app"
      responses:
        '201':
          description: User registered and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              examples:
                created:
                  summary: Registration succeeded
                  value:
                    data:
                      user:
                        id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                        name: "Example User"
                        email: "user@example.com"
                      access_token: "1|examplePlainTextTokenThatIsOnlyReturnedOnce"
                      token_type: "Bearer"
                    message: "تم تسجيل الحساب بنجاح."
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Authenticate credentials and issue an access token
      description: |
        Validates the email and password and issues a Sanctum personal access
        token. Invalid credentials return a validation error and never reveal
        whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                summary: Log in with email and password
                value:
                  email: "user@example.com"
                  password: "password"
                  device_name: "web-client"
      responses:
        '200':
          description: Credentials accepted and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              examples:
                authenticated:
                  summary: Login succeeded
                  value:
                    data:
                      user:
                        id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                        name: "Example User"
                        email: "user@example.com"
                      access_token: "2|examplePlainTextTokenThatIsOnlyReturnedOnce"
                      token_type: "Bearer"
                    message: "تم تسجيل الدخول بنجاح."
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Revoke the current access token
      description: |
        Revokes the Sanctum personal access token used for the current request.
        Other tokens belonging to the user remain valid.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              examples:
                loggedOut:
                  summary: Logout succeeded
                  value:
                    data: null
                    message: "تم تسجيل الخروج بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAll
      summary: Revoke every access token for the authenticated user
      description: |
        Revokes every Sanctum personal access token belonging to the
        authenticated user, including the token used for this request. Tokens
        belonging to other users are not affected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All tokens belonging to the authenticated user revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              examples:
                loggedOutAll:
                  summary: Logout-all succeeded
                  value:
                    data: null
                    message: "تم إلغاء جميع رموز الوصول بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getAuthenticatedUser
      summary: Get the authenticated user
      description: Returns the authenticated user's public profile fields.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                currentUser:
                  summary: Authenticated user
                  value:
                    data:
                      id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                      name: "Example User"
                      email: "user@example.com"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/profile:
    patch:
      tags:
        - Auth
      operationId: updateProfile
      summary: Update the authenticated user's profile
      description: |
        Updates the authenticated user's name and/or email. Changing the email
        clears email_verified_at.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              updateProfile:
                summary: Update name and email
                value:
                  name: "Updated User"
                  email: "updated@example.com"
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMessageResponse'
              examples:
                updated:
                  summary: Profile updated
                  value:
                    data:
                      id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                      name: "Updated User"
                      email: "updated@example.com"
                    message: "تم تحديث الملف الشخصي بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Auth
      operationId: updateProfileWithPut
      summary: Update the authenticated user's profile
      description: |
        PUT alternative for updating the authenticated user's name and/or email.
        Changing the email clears email_verified_at.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/password:
    put:
      tags:
        - Auth
      operationId: changePassword
      summary: Change the authenticated user's password
      description: |
        Verifies the current password and updates the authenticated user's
        password hash.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              changePassword:
                summary: Change password
                value:
                  current_password: "password"
                  password: "new-password"
                  password_confirmation: "new-password"
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              examples:
                changed:
                  summary: Password changed
                  value:
                    data: null
                    message: "تم تغيير كلمة المرور بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Auth
      operationId: changePasswordWithPatch
      summary: Change the authenticated user's password
      description: |
        PATCH alternative for verifying the current password and updating the
        authenticated user's password hash.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/conversations:
    get:
      tags:
        - Conversations
      operationId: listConversations
      summary: List the authenticated user's conversations
      description: |
        Returns only conversations owned by the authenticated user, paginated
        by page number. Pinned conversations are returned first, followed by
        conversations ordered by updated_at and id descending.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/QQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: Paginated conversations owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
              examples:
                conversations:
                  summary: Conversation list
                  value:
                    data:
                      - id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                        title: "Planning a trip to Japan"
                        is_pinned: true
                        pinned_at: "2026-11-12T09:00:00+00:00"
                        created_at: "2026-11-10T08:30:00+00:00"
                        updated_at: "2026-11-12T09:00:00+00:00"
                    links:
                      first: "https://example.test/api/v1/conversations?page=1"
                      last: "https://example.test/api/v1/conversations?page=1"
                      prev: null
                      next: null
                    meta:
                      path: "https://example.test/api/v1/conversations"
                      current_page: 1
                      from: 1
                      last_page: 1
                      per_page: 15
                      to: 1
                      total: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Conversations
      operationId: createConversation
      summary: Create a conversation
      description: Creates a conversation owned by the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreConversationRequest'
            examples:
              createConversation:
                summary: Create a titled conversation
                value:
                  title: "Planning a trip"
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                created:
                  summary: Conversation created
                  value:
                    data:
                      id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                      title: "Planning a trip"
                      is_pinned: false
                      pinned_at: null
                      created_at: "2026-11-13T10:00:00+00:00"
                      updated_at: "2026-11-13T10:00:00+00:00"
                    message: "تم إنشاء المحادثة بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Conversations
      operationId: deleteConversations
      summary: Bulk delete conversations
      description: |
        Deletes up to 50 selected conversations and their messages in one
        transaction. The operation is all-or-nothing: if any ID is missing or
        belongs to another user, nothing is deleted and the API returns 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteConversationsRequest'
            examples:
              bulkDelete:
                summary: Delete two conversations
                value:
                  ids:
                    - "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                    - "01JZ9M0R6V8X3K4P5Q7S9T2W6B"
      responses:
        '200':
          description: Selected conversations deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              examples:
                deleted:
                  summary: Bulk deletion succeeded
                  value:
                    data: null
                    message: "تم حذف المحادثات المحددة بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConversationBusy'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/conversations/search:
    get:
      tags:
        - Conversations
      operationId: searchConversations
      summary: Search the authenticated user's conversations
      description: |
        Behaves like conversation listing. Use q or search to filter the
        authenticated user's conversations by title. q is used only when search
        is absent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/QQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: Paginated matching conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/conversations/{conversation}:
    get:
      tags:
        - Conversations
      operationId: showConversation
      summary: Get a conversation
      description: Returns conversation metadata without embedded messages.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Conversations
      operationId: updateConversation
      summary: Rename a conversation
      description: Updates the conversation title.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
            examples:
              rename:
                summary: Rename a conversation
                value:
                  title: "New title"
      responses:
        '200':
          description: Conversation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                updated:
                  summary: Conversation renamed
                  value:
                    data:
                      id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                      title: "New title"
                      is_pinned: false
                      pinned_at: null
                      created_at: "2026-11-13T10:00:00+00:00"
                      updated_at: "2026-11-13T10:05:00+00:00"
                    message: "تم تحديث المحادثة بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Conversations
      operationId: updateConversationWithPut
      summary: Rename a conversation
      description: PUT alternative for updating the conversation title.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Conversation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Conversations
      operationId: deleteConversation
      summary: Delete a conversation
      description: |
        Deletes the conversation and its messages. AI request audit rows are
        retained with their conversation and message references cleared.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              examples:
                deleted:
                  summary: Conversation deleted
                  value:
                    data: null
                    message: "تم حذف المحادثة بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConversationBusy'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/conversations/{conversation}/pin:
    post:
      tags:
        - Conversations
      operationId: pinConversation
      summary: Pin a conversation
      description: |
        Pins the conversation. Pinning an already pinned conversation does not
        change pinned_at.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation pinned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                pinned:
                  summary: Conversation pinned
                  value:
                    data:
                      id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                      title: "Planning a trip"
                      is_pinned: true
                      pinned_at: "2026-11-13T10:10:00+00:00"
                      created_at: "2026-11-13T10:00:00+00:00"
                      updated_at: "2026-11-13T10:10:00+00:00"
                    message: "تم تثبيت المحادثة بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Conversations
      operationId: unpinConversation
      summary: Unpin a conversation
      description: |
        Removes the pin from the conversation. Unpinning a conversation that is
        not pinned is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation unpinned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                unpinned:
                  summary: Conversation unpinned
                  value:
                    data:
                      id: "01JZ9M0R6V8X3K4P5Q7S9T2W6A"
                      title: "Planning a trip"
                      is_pinned: false
                      pinned_at: null
                      created_at: "2026-11-13T10:00:00+00:00"
                      updated_at: "2026-11-13T10:10:00+00:00"
                    message: "تم إلغاء تثبيت المحادثة بنجاح."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/conversations/{conversation}/messages:
    get:
      tags:
        - Messages
      operationId: listMessages
      summary: List messages in a conversation
      description: |
        Returns messages for a conversation using cursor pagination. The newest
        page is returned first, but messages within each page are ordered
        chronologically. All message statuses are included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Cursor-paginated messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
              examples:
                messages:
                  summary: A page of messages
                  value:
                    data:
                      - id: "01JZ9M0R6V8X3K4P5Q7S9T2W6B"
                        role: "user"
                        content: "What should I pack?"
                        status: "complete"
                        created_at: "2026-11-13T10:14:00+00:00"
